services:
  db:
    image: postgres:16-alpine
    volumes:
      - pg_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: logopulse
      POSTGRES_USER: logopulse
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD di .env}
    restart: unless-stopped

  api:
    build: ./backend
    depends_on: [db]
    environment:
      DATABASE_URL: postgres://logopulse:${DB_PASSWORD:?set DB_PASSWORD di .env}@db:5432/logopulse?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET 48+ karakter di .env}
      UPLOAD_DIR: /app/uploads
      PORT: 8080
      TRUST_PROXY_HEADERS: "1"
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./frontend/dist:/usr/share/nginx/html
      - ./admin/dist:/usr/share/nginx/html/admin
      - uploads:/usr/share/nginx/uploads
      - certs:/etc/letsencrypt
    depends_on: [api]
    restart: unless-stopped

volumes:
  pg_data:
  uploads:
  certs:
