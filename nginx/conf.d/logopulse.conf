server {
  listen 80;
  server_name _;
    add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  location /api/v1/ { proxy_pass http://api:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
  location /uploads/ {
    alias /usr/share/nginx/uploads/;
    expires 365d;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
    # CATATAN: aktifkan HTTPS (certbot) lalu tambah redirect 80->443 + HSTS (L6).
  }
  location /admin/ { alias /usr/share/nginx/html/admin/; try_files $uri $uri/ /admin/index.html; }
  location / { root /usr/share/nginx/html; try_files $uri $uri/ /index.html; }
}
