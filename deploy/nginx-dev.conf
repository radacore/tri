# vhost STAGING — dev.brandingpulse.co (port API 8081, direktori -dev)
# Salin ke /etc/nginx/sites-available/dev.brandingpulse.co, symlink ke sites-enabled.
# Sertifikat: sudo certbot --nginx -d dev.brandingpulse.co
server {
  listen 80;
  server_name dev.brandingpulse.co;

  # Lindungi staging dari index mesin pencari + rasa ingin tahu:
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;

  location /api/v1/ {
    proxy_pass http://127.0.0.1:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location /uploads/ {
    alias /var/lib/brandingpulse-dev/uploads/;
    expires 7d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
  }

  location /admin/ {
    alias /opt/brandingpulse-dev/current/admin/;
    try_files $uri $uri/ /admin/index.html;
    # Opsional: kunci staging dengan basic-auth bila perlu:
    # auth_basic "staging"; auth_basic_user_file /etc/nginx/.htpasswd-staging;
  }

  location / {
    root /opt/brandingpulse-dev/current/landing;
    try_files $uri $uri/ /index.html;
  }
}
# Blok :443 sama seperti prod (lihat nginx-prod.conf), ganti server_name + port API.
