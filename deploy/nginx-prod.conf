# vhost PRODUKSI — brandingpulse.co (+ www)
# Salin ke /etc/nginx/sites-available/brandingpulse.co, symlink ke sites-enabled.
# Tahap 1 (belum ada sertifikat): biarkan blok :443 ter-comment, hanya :80 jalan.
# Tahap 2: sudo certbot --nginx -d brandingpulse.co -d www.brandingpulse.co
server {
  listen 80;
  server_name brandingpulse.co www.brandingpulse.co;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # gzip untuk aset teks
  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;

  location /api/v1/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location /uploads/ {
    alias /var/lib/brandingpulse/uploads/;
    expires 365d;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
  }

  location /admin/ {
    alias /opt/brandingpulse/current/admin/;
    try_files $uri $uri/ /admin/index.html;
  }

  location / {
    root /opt/brandingpulse/current/landing;
    try_files $uri $uri/ /index.html;
  }
}

