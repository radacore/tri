# vhost PRODUKSI — brandingpulse.co (+ www)
# Salin ke /etc/nginx/sites-available/brandingpulse.co, symlink ke sites-enabled.
# TLS dikelola certbot (satu sertifikat untuk brandingpulse.co + dev + www).
# Perbarui: sudo certbot renew --deploy-hook "systemctl reload nginx"
server {
  server_name brandingpulse.co www.brandingpulse.co;

  # Jangan bocorkan versi nginx di header Server / halaman error.
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  # HSTS ikut terkirim ke klien lewat Cloudflare (origin :443 di belakang CF).
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  # CSP dilaporkan dulu (Report-Only) sebelum dienforce.
  add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'; img-src 'self' data: https:; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), interest-cohort=()" always;

  # gzip untuk aset teks
  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;

  location /api/v1/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location /uploads/ {
    alias /var/lib/brandingpulse/uploads/;
    expires 365d;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
  }

  location /admin/ {
    alias /opt/brandingpulse/current/admin/;
    try_files $uri $uri/ /admin/index.html;
  }

  # Soft-404: halaman tak dikenal -> /404.html dengan status 404 asli.
  error_page 404 /404.html;

  location / {
    root /opt/brandingpulse/current/landing;
    try_files $uri $uri/ =404;
  }

  listen 443 ssl; # managed by Certbot
  ssl_certificate /etc/letsencrypt/live/brandingpulse.co/fullchain.pem; # managed by Certbot
  ssl_certificate_key /etc/letsencrypt/live/brandingpulse.co/privkey.pem; # managed by Certbot
  include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
  if ($host = www.brandingpulse.co) {
    return 301 https://$host$request_uri;
  } # managed by Certbot

  if ($host = brandingpulse.co) {
    return 301 https://$host$request_uri;
  } # managed by Certbot

  listen 80;
  server_name brandingpulse.co www.brandingpulse.co;
  return 404; # managed by Certbot
}
